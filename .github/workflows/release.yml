name: Release

# Pushing a tag such as v0.1.0 builds on a clean runner and creates a GitHub Release with the zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - run: cargo test --locked
      - run: cargo build --locked --release

      - name: Package
        run: |
          $name = "gamepulse-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/gamepulse.exe, target/release/gamepulse-cli.exe, README.md, README.th.md, LICENSE $name
          # Fonts are embedded in the exe: the OFL requires shipping their licenses too
          New-Item -ItemType Directory "$name/fonts" | Out-Null
          Copy-Item assets/fonts/*-OFL.txt "$name/fonts"
          # The READMEs link to docs/ (guides and screenshots), so ship it too
          Copy-Item docs "$name/docs" -Recurse
          New-Item -ItemType Directory "$name/assets" | Out-Null
          Copy-Item assets/icon-256.png "$name/assets"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "gamepulse-${{ github.ref_name }}-windows-x64.zip" `
            "gamepulse-${{ github.ref_name }}-windows-x64.zip.sha256" `
            --title "Gamepulse ${{ github.ref_name }}" `
            --generate-notes
